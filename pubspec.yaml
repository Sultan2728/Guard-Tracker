name: guard_tracker
description: "Onsite — контроль присутствия сотрудников на объекте"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_auth: ^5.3.1

  # Location
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # Local storage (remember role/guard slot on this device)
  shared_preferences: ^2.3.2

  # Notifications shown on the phone
  flutter_local_notifications: ^18.0.1

  # Interactive map for picking a site's zone (OpenStreetMap — free, no API key)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# App icon: run `dart run flutter_launcher_icons` after changing the images.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0F1E38"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
