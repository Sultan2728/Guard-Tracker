name: guard_tracker
description: "Трекер охраны — контроль входа/выхода из зоны объекта"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # Location
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # Local storage (remember role/guard slot on this device)
  shared_preferences: ^2.3.2

  # Notifications shown on the phone
  flutter_local_notifications: ^18.0.1

  # Interactive map for picking a site's zone (OpenStreetMap — free, no API key)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
